AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Purdy Renting Platform - serverless infrastructure (SAM).
  Provisions DynamoDB, S3, API Gateway (Cognito + API key auth), six Lambda
  functions with least-privilege IAM, a native Cognito User Pool (email +
  password, admin-created users), and a CloudFront distribution for the React
  SPA. Confirmation notifications are delivered via an external POST service
  (webhook), not SES.
  Requirements: 1.1, 1.2, 10.1, 10.2, 10.5

# --------------------------------------------------------------------------- #
# Parameters - environment-specific values. Replace placeholder defaults per   #
# environment (dev/staging/prod) at deploy time via --parameter-overrides.     #
# --------------------------------------------------------------------------- #
Parameters:
  EnvironmentName:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment name (used as a resource name suffix).

  EnablePitr:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: >
      Activa Point-In-Time Recovery en DynamoDB. Recomendado "true" en prod,
      "false" en dev/staging para evitar costo continuo de backup.

  LogRetentionInDays:
    Type: Number
    Default: 30
    Description: Dias de retencion de los CloudWatch Logs de las Lambdas.

  FrontendDomain:
    Type: String
    Default: https://app.purdyrenting.example.com
    Description: >
      Fully-qualified origin of the React SPA (scheme + host). Used for the S3
      CORS allowed origin and the Cognito callback/logout URLs.

  IntegrationsSecretArn:
    Type: String
    Default: ""
    Description: >
      ARN del secreto en AWS Secrets Manager con las integraciones (JSON con
      claves uipath_client_secret y notification_webhook_url). Es la fuente
      preferida de secretos; los parametros UiPathClientSecret y
      NotificationWebhookUrl quedan como fallback opcional (dejar vacios).

  NotificationWebhookUrl:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      (Fallback) URL del servicio POST de notificaciones. Preferir
      IntegrationsSecretArn. Dejar vacio si se usa Secrets Manager.

  # ---- UiPath Orchestrator (disparo de job desde CreateRequest) ----
  UiPathTokenUrl:
    Type: String
    Default: https://cloud.uipath.com/identity_/connect/token
    Description: Identity server URL para autenticacion (client_credentials).

  UiPathClientId:
    Type: String
    Default: 8f64dac1-9ba3-4e42-a0f3-ca11aaff7dc2
    Description: client_id de la aplicacion externa de UiPath.

  UiPathClientSecret:
    Type: String
    Default: ""
    NoEcho: true
    Description: >
      (Fallback) client_secret de UiPath. Preferir IntegrationsSecretArn
      (Secrets Manager). Dejar vacio si se usa Secrets Manager.

  UiPathScope:
    Type: String
    Default: OR.Jobs OR.Execution OR.Folders
    Description: Scopes OAuth solicitados a UiPath.

  UiPathJobsUrl:
    Type: String
    Default: https://cloud.uipath.com/grupopurdyrentingcommunity/DefaultTenant/orchestrator_/odata/Jobs/UiPath.Server.Configuration.OData.StartJobs
    Description: Endpoint OData StartJobs de Orchestrator.

  UiPathReleaseKey:
    Type: String
    Default: 94b379af-77fa-4320-b792-1682ef8171ac
    Description: ReleaseKey del proceso a ejecutar.

  UiPathOrgUnitId:
    Type: String
    Default: "8073429"
    Description: X-UIPATH-OrganizationUnitId (folder) del job.

# --------------------------------------------------------------------------- #
# Conditions                                                                   #
# --------------------------------------------------------------------------- #
Conditions:
  PitrEnabled: !Equals [!Ref EnablePitr, "true"]
  HasIntegrationsSecret: !Not [!Equals [!Ref IntegrationsSecretArn, ""]]

# --------------------------------------------------------------------------- #
# Globals - defaults shared by all serverless functions.                       #
# --------------------------------------------------------------------------- #
Globals:
  Function:
    Runtime: python3.14
    Timeout: 30
    MemorySize: 256
    Architectures:
      - x86_64
    Environment:
      Variables:
        REQUESTS_TABLE: !Ref RequestsTable
        FILES_BUCKET: !Ref FilesBucket

Resources:
  # ------------------------------------------------------------------------- #
  # DynamoDB - single-table design with GSI1 for user queries.                 #
  # ------------------------------------------------------------------------- #
  RequestsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "PurdyRentingRequests-${EnvironmentName}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: !If [PitrEnabled, true, false]

  # ------------------------------------------------------------------------- #
  # S3 - file storage for uploaded and generated files. SSE-S3, CORS, no       #
  # public access (Requirements 10.2, 10.5).                                   #
  # ------------------------------------------------------------------------- #
  FilesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "purdy-renting-files-${EnvironmentName}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - !Ref FrontendDomain
            AllowedMethods:
              - PUT
              - GET
            AllowedHeaders:
              - "*"
            ExposedHeaders:
              - ETag
            MaxAge: 3000
      # Retencion de datos: minimo 12 meses. El volumen es bajo (max ~8
      # archivos/mes), asi que el costo de almacenamiento es despreciable.
      # Se pasa a Standard-IA tras 90 dias (mas barato para datos poco
      # accedidos) y se expira a los ~13 meses (400 dias). Los multipart
      # incompletos se limpian a los 7 dias.
      LifecycleConfiguration:
        Rules:
          - Id: TransitionUploadsToIA
            Status: Enabled
            Prefix: uploads/
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 90
            ExpirationInDays: 400
          - Id: TransitionGeneratedToIA
            Status: Enabled
            Prefix: generated/
            Transitions:
              - StorageClass: STANDARD_IA
                TransitionInDays: 90
            ExpirationInDays: 400
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7

  # ------------------------------------------------------------------------- #
  # Cognito - User Pool nativo (email + password). El admin da de alta a los   #
  # usuarios (AllowAdminCreateUserOnly) y les asigna el grupo/rol.             #
  # El SPA administra su propio formulario de login (USER_PASSWORD_AUTH /      #
  # SRP), sin Hosted UI ni federacion externa. (Requirements 1.1, 1.2).        #
  # ------------------------------------------------------------------------- #
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "purdy-renting-${EnvironmentName}"
      # Solo el admin crea usuarios; no hay auto-registro publico.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: false

  # Grupo/rol "solicitante". El admin asigna el usuario a este grupo tras el
  # alta. El backend/authorizer puede leer "cognito:groups" del token.
  SolicitantesGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: solicitantes
      Description: Usuarios con rol de solicitante (crean solicitudes).
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "purdy-renting-web-${EnvironmentName}"
      UserPoolId: !Ref UserPool
      # SPA publico: sin client secret.
      GenerateSecret: false
      SupportedIdentityProviders:
        - COGNITO
      # Token lifetimes per design: 60 min access/ID, 30 day refresh.
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes
        RefreshToken: days
      # Flujos de auth para login con formulario propio (email + password).
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      PreventUserExistenceErrors: ENABLED

  # ------------------------------------------------------------------------- #
  # API Gateway - REST API with a Cognito authorizer plus API-key auth for     #
  # the Robot endpoints (Requirements 10.1, 10.6, 7.7, 7.8).                   #
  # ------------------------------------------------------------------------- #
  Api:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "purdy-renting-api-${EnvironmentName}"
      StageName: !Ref EnvironmentName
      # API keys are required only on methods that opt in via ApiKeyRequired.
      ApiKeySourceType: HEADER
      Cors:
        AllowMethods: "'GET,POST,PUT,OPTIONS'"
        AllowHeaders: "'Content-Type,Authorization,X-Api-Key'"
        AllowOrigin: !Sub "'${FrontendDomain}'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        # No exigir el authorizer en el preflight CORS (OPTIONS): el navegador
        # envia OPTIONS sin token, y si se exige auth devuelve 401 y bloquea la
        # peticion real. Los OPTIONS quedan publicos (solo devuelven headers CORS).
        AddDefaultAuthorizerToCorsPreflight: false
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt UserPool.Arn
            Identity:
              Header: Authorization
        # Usage plan + API key for machine-to-machine (Robot) endpoints.
        ApiKeyRequired: false
        UsagePlan:
          CreateUsagePlan: PER_API
          UsagePlanName: !Sub "purdy-renting-robot-plan-${EnvironmentName}"
          Description: Usage plan for the RPA Robot endpoints.
          Throttle:
            BurstLimit: 20
            RateLimit: 10
          Quota:
            Limit: 10000
            Period: DAY

  # ------------------------------------------------------------------------- #
  # Gateway responses - ensure CORS headers are present on error responses     #
  # that API Gateway generates BEFORE reaching a Lambda (e.g. 401/403 from the #
  # Cognito authorizer or the API-key check, 4XX validation errors, and 5XX    #
  # server errors). The SAM `Cors` block above only adds headers to the OPTIONS #
  # preflight mock and to successful proxy responses, so without these the      #
  # browser blocks the frontend from reading gateway-generated error bodies.    #
  # (Requirements 7.8, 10.6)                                                    #
  # ------------------------------------------------------------------------- #
  GatewayResponseDefault4XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref Api
      # Covers 400/401/403/404/409 etc. - including the 401 from a missing/
      # invalid API key (Req 7.8) and 4XX validation errors.
      ResponseType: DEFAULT_4XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${FrontendDomain}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Api-Key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,OPTIONS'"

  GatewayResponseDefault5XX:
    Type: AWS::ApiGateway::GatewayResponse
    Properties:
      RestApiId: !Ref Api
      ResponseType: DEFAULT_5XX
      ResponseParameters:
        gatewayresponse.header.Access-Control-Allow-Origin: !Sub "'${FrontendDomain}'"
        gatewayresponse.header.Access-Control-Allow-Headers: "'Content-Type,Authorization,X-Api-Key'"
        gatewayresponse.header.Access-Control-Allow-Methods: "'GET,POST,PUT,OPTIONS'"

  # ------------------------------------------------------------------------- #
  # Lambda functions. CodeUri points at ../backend; handlers are               #
  # handlers/<module>.handler. Each function gets a scoped IAM policy.         #
  # ------------------------------------------------------------------------- #

  # --- Cognito-authenticated user endpoints -------------------------------- #
  GetPresignedUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "purdy-GetPresignedUrl-${EnvironmentName}"
      CodeUri: ../backend
      Handler: handlers/get_presigned_url.handler
      Policies:
        # Presigned PUT URL generation needs the ability to put objects.
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "${FilesBucket.Arn}/*"
      Events:
        PostPresignedUrl:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /requests/presigned-url
            Method: post

  CreateRequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "purdy-CreateRequest-${EnvironmentName}"
      CodeUri: ../backend
      Handler: handlers/create_request.handler
      Environment:
        Variables:
          # Secretos de integraciones desde Secrets Manager (fuente preferida).
          INTEGRATIONS_SECRET_ID: !Ref IntegrationsSecretArn
          # Fallback opcional (vacios si se usa Secrets Manager).
          NOTIFICATION_WEBHOOK_URL: !Ref NotificationWebhookUrl
          # UiPath Orchestrator (disparo de job tras crear la solicitud).
          UIPATH_TOKEN_URL: !Ref UiPathTokenUrl
          UIPATH_CLIENT_ID: !Ref UiPathClientId
          UIPATH_CLIENT_SECRET: !Ref UiPathClientSecret
          UIPATH_SCOPE: !Ref UiPathScope
          UIPATH_JOBS_URL: !Ref UiPathJobsUrl
          UIPATH_RELEASE_KEY: !Ref UiPathReleaseKey
          UIPATH_ORG_UNIT_ID: !Ref UiPathOrgUnitId
      Policies:
        - Statement:
            # Write the new request record.
            - Effect: Allow
              Action:
                - dynamodb:PutItem
              Resource: !GetAtt RequestsTable.Arn
            # Verify uploaded files exist (HeadObject -> s3:GetObject)
            # y leerlos para enviarlos en base64 a UiPath.
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "${FilesBucket.Arn}/*"
        # Permiso para leer el secreto de integraciones (solo si esta definido).
        - !If
          - HasIntegrationsSecret
          - Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref IntegrationsSecretArn
          - !Ref AWS::NoValue
      Events:
        PostRequest:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /requests
            Method: post

  GetRequestsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "purdy-GetRequests-${EnvironmentName}"
      CodeUri: ../backend
      Handler: handlers/get_requests.handler
      Policies:
        - Statement:
            # Query the GSI1 index for the user's requests.
            - Effect: Allow
              Action:
                - dynamodb:Query
              Resource:
                - !GetAtt RequestsTable.Arn
                - !Sub "${RequestsTable.Arn}/index/GSI1"
      Events:
        GetRequestsEvent:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /requests
            Method: get

  GetDownloadUrlFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "purdy-GetDownloadUrl-${EnvironmentName}"
      CodeUri: ../backend
      Handler: handlers/get_download_url.handler
      Policies:
        - Statement:
            # Read the request record to enforce ownership.
            - Effect: Allow
              Action:
                - dynamodb:GetItem
              Resource: !GetAtt RequestsTable.Arn
            # Presigned GET URL generation needs object read access.
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "${FilesBucket.Arn}/*"
      Events:
        GetDownload:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /requests/{id}/download
            Method: get

  # --- API-key authenticated Robot endpoints ------------------------------- #
  UpdateStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "purdy-UpdateStatus-${EnvironmentName}"
      CodeUri: ../backend
      Handler: handlers/update_status.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt RequestsTable.Arn
      Events:
        PutStatus:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /requests/{id}/status
            Method: put
            # Robot auth: API key, not Cognito.
            Auth:
              Authorizer: NONE
              ApiKeyRequired: true

  UploadGeneratedFileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "purdy-UploadGeneratedFile-${EnvironmentName}"
      CodeUri: ../backend
      Handler: handlers/upload_generated_file.handler
      # Base64 payloads up to 50 MB decoded; allow extra memory/time.
      MemorySize: 512
      Timeout: 60
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
              Resource: !GetAtt RequestsTable.Arn
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "${FilesBucket.Arn}/*"
      Events:
        PostFile:
          Type: Api
          Properties:
            RestApiId: !Ref Api
            Path: /requests/{id}/file
            Method: post
            Auth:
              Authorizer: NONE
              ApiKeyRequired: true

  # ------------------------------------------------------------------------- #
  # CloudFront + site bucket for the built React SPA.                          #
  # The site bucket is separate from the file-storage bucket. Access is        #
  # restricted to CloudFront via Origin Access Control (no public access).     #
  # ------------------------------------------------------------------------- #
  SiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "purdy-renting-site-${EnvironmentName}-${AWS::AccountId}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "purdy-renting-site-oac-${EnvironmentName}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "Purdy Renting SPA (${EnvironmentName})"
        DefaultRootObject: index.html
        # SPA client-side routing: serve index.html for 403/404.
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        Origins:
          - Id: SiteS3Origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !Ref SiteOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: SiteS3Origin
          ViewerProtocolPolicy: redirect-to-https
          # AWS managed CachingOptimized policy id.
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  # Bucket policy allowing only this CloudFront distribution to read objects.
  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution.Id}"

  # ------------------------------------------------------------------------- #
  # CloudWatch Log Groups - retencion acotada para que los logs no se          #
  # acumulen indefinidamente (control de costo). El nombre coincide con el      #
  # que Lambda usa por convencion: /aws/lambda/<FunctionName>.                  #
  # ------------------------------------------------------------------------- #
  GetPresignedUrlLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/purdy-GetPresignedUrl-${EnvironmentName}"
      RetentionInDays: !Ref LogRetentionInDays

  CreateRequestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/purdy-CreateRequest-${EnvironmentName}"
      RetentionInDays: !Ref LogRetentionInDays

  GetRequestsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/purdy-GetRequests-${EnvironmentName}"
      RetentionInDays: !Ref LogRetentionInDays

  GetDownloadUrlLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/purdy-GetDownloadUrl-${EnvironmentName}"
      RetentionInDays: !Ref LogRetentionInDays

  UpdateStatusLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/purdy-UpdateStatus-${EnvironmentName}"
      RetentionInDays: !Ref LogRetentionInDays

  UploadGeneratedFileLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/purdy-UploadGeneratedFile-${EnvironmentName}"
      RetentionInDays: !Ref LogRetentionInDays

# --------------------------------------------------------------------------- #
# Outputs - values needed by the frontend build and Robot integration.         #
# --------------------------------------------------------------------------- #
Outputs:
  ApiBaseUrl:
    Description: Base URL of the REST API.
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${EnvironmentName}"

  RequestsTableName:
    Description: DynamoDB requests table name.
    Value: !Ref RequestsTable

  FilesBucketName:
    Description: S3 bucket for uploaded and generated files.
    Value: !Ref FilesBucket

  UserPoolId:
    Description: Cognito User Pool ID.
    Value: !Ref UserPool

  UserPoolClientId:
    Description: Cognito User Pool App Client ID (for the SPA).
    Value: !Ref UserPoolClient

  SiteBucketName:
    Description: S3 bucket that hosts the built React SPA.
    Value: !Ref SiteBucket

  CloudFrontDomain:
    Description: CloudFront domain serving the SPA.
    Value: !GetAtt SiteDistribution.DomainName

  RobotApiKeyId:
    Description: >
      ID of the API key auto-created by the SAM usage plan for the Robot
      endpoints. Retrieve the secret value via the API Gateway console/CLI.
    Value: !Ref ApiApiKey
